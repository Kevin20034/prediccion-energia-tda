[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# La URL NO se pone aquí: la inyecta alembic/env.py desde el .env, usando el
# endpoint DIRECTO de Neon. Así las credenciales no viven en un fichero
# versionado.
sqlalchemy.url =

# Formateo automático de las migraciones generadas. Desactivado por defecto:
# depende de que `ruff` sea resoluble como entrypoint, lo que no ocurre en
# todos los entornos virtuales de Windows. Para activarlo, descomenta:
# [post_write_hooks]
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
